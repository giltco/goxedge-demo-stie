
:root{
  --ink:#0f172a; --muted:#475569; --subtle:#64748b; --blue:#1677ff; --blue-dark:#0958d9;
  --line:#e5e7eb; --soft:#f6f8fb; --soft-blue:#eef6ff; --card:#ffffff; --amber:#f59e0b;
  --shadow:0 14px 35px rgba(15,23,42,.08); --radius:18px; --max:1160px;
}
*{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--ink);background:#fff;line-height:1.68}
a{color:inherit;text-decoration:none} .container{max-width:var(--max);margin:0 auto;padding:0 24px}.site-header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.nav-shell{height:68px;display:flex;align-items:center;gap:26px}.brand{display:inline-flex;align-items:center;gap:10px;font-weight:800;color:var(--ink)}.brand-mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--blue),var(--blue-dark));display:grid;place-items:center;color:#fff;font-weight:900;letter-spacing:-.03em;box-shadow:0 8px 18px rgba(22,119,255,.25)}.brand-text{font-size:19px;letter-spacing:-.02em}.nav-menu{display:flex;align-items:center;gap:4px;flex:1}.nav-link{font-size:14px;color:#334155;padding:9px 12px;border-radius:999px}.nav-link:hover,.nav-link.active{background:var(--soft-blue);color:var(--blue-dark)}.nav-actions{display:flex;align-items:center;gap:10px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:10px 16px;font-weight:700;font-size:14px;border:1px solid transparent;cursor:pointer;line-height:1.2}.btn-primary{background:var(--blue);color:#fff;box-shadow:0 12px 24px rgba(22,119,255,.22)}.btn-primary:hover{background:var(--blue-dark)}.btn-ghost{background:#fff;color:var(--blue-dark);border-color:#bfdbfe}.btn-ghost:hover{background:var(--soft-blue)}.btn-dark{background:var(--ink);color:#fff}.mobile-menu-toggle{display:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:700}.hero{padding:84px 0;background:linear-gradient(180deg,#fff 0%,#f8fbff 100%)}.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}.eyebrow,.kicker{display:inline-flex;align-items:center;gap:8px;color:var(--blue-dark);font-size:13px;font-weight:800;letter-spacing:.02em;background:var(--soft-blue);border:1px solid #d6e8ff;border-radius:999px;padding:6px 12px}.hero h1{font-size:54px;line-height:1.08;margin:18px 0 20px;letter-spacing:-.04em}.hero p.lead{font-size:19px;color:var(--muted);margin:0 0 28px}.hero-actions{display:flex;gap:12px;flex-wrap:wrap}.hero-note{margin-top:22px;color:var(--subtle);font-size:14px}.book-card,.model-card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:var(--shadow)}.book-cover{min-height:410px;border-radius:18px;background:linear-gradient(135deg,#0f172a,#1d4ed8);color:#fff;padding:34px;display:flex;flex-direction:column;justify-content:space-between}.book-cover h3{font-size:32px;line-height:1.18;margin:0}.book-cover p{color:#dbeafe;margin:0}.book-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.meta-chip{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px}.meta-chip strong{display:block;font-size:13px}.meta-chip span{font-size:13px;color:var(--muted)}section{padding:72px 0}.section-alt{background:var(--soft)}.section-head{max-width:760px;margin:0 0 32px}.section-head.center{text-align:center;margin:0 auto 36px}.section-head h2{font-size:34px;line-height:1.2;margin:14px 0 10px;letter-spacing:-.03em}.section-head p{color:var(--muted);margin:0}.grid{display:grid;gap:20px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:0 4px 18px rgba(15,23,42,.04)}.card h3{font-size:19px;line-height:1.35;margin:0 0 10px}.card p{color:var(--muted);margin:0}.card .tag{margin-bottom:14px}.tag{display:inline-flex;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800;background:#eff6ff;color:#1d4ed8;border:1px solid #dbeafe}.tag.gray{background:#f8fafc;color:#334155;border-color:#e2e8f0}.tag.amber{background:#fffbeb;color:#92400e;border-color:#fde68a}.stage-row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.stage{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center;position:relative}.stage strong{display:block;font-size:17px}.stage span{display:block;font-size:12px;color:var(--muted);margin-top:6px}.stage:after{content:"";position:absolute;right:-11px;top:50%;width:10px;height:1px;background:var(--line)}.stage:last-child:after{display:none}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 4px 18px rgba(15,23,42,.04)}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:15px 16px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#f8fafc;font-size:13px;color:#334155}td{font-size:14px;color:#334155}tr:last-child td{border-bottom:0}.tool-card{display:flex;flex-direction:column;gap:14px}.tool-meta{display:flex;gap:8px;flex-wrap:wrap}.list{padding-left:0;list-style:none;margin:16px 0 0}.list li{position:relative;padding-left:24px;margin:10px 0;color:var(--muted)}.list li:before{content:"";position:absolute;left:0;top:.65em;width:8px;height:8px;border-radius:50%;background:var(--blue)}.quote{border-left:4px solid var(--blue);padding:18px 22px;background:#fff;border-radius:0 16px 16px 0;color:var(--muted)}.cta-band{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;padding:56px 0}.cta-inner{display:flex;align-items:center;justify-content:space-between;gap:28px}.cta-inner h2{margin:0 0 8px;font-size:30px}.cta-inner p{margin:0;color:#dbeafe}.site-footer{background:#0b1220;color:#cbd5e1;padding:54px 0 22px}.footer-grid{display:grid;grid-template-columns:1.5fr repeat(4,1fr);gap:28px}.footer-brand p{color:#94a3b8;margin:16px 0 0}.site-footer .brand-text{color:#fff}.footer-col h4{margin:0 0 12px;color:#fff;font-size:14px}.footer-col a{display:block;color:#94a3b8;font-size:13px;margin:8px 0}.footer-col a:hover{color:#fff}.footer-bottom{border-top:1px solid rgba(255,255,255,.08);margin-top:32px;padding-top:18px;display:flex;justify-content:space-between;gap:16px;color:#64748b;font-size:12px}.page-hero{padding:66px 0 48px;background:linear-gradient(180deg,#fff 0%,#f8fbff 100%)}.page-hero h1{font-size:44px;line-height:1.12;margin:16px 0}.page-hero p{max-width:820px;color:var(--muted);font-size:18px}.breadcrumb{font-size:13px;color:var(--subtle);margin-bottom:16px}.breadcrumb a{color:var(--blue-dark)}.two-col{display:grid;grid-template-columns:280px 1fr;gap:32px;align-items:start}.side-card{position:sticky;top:88px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.side-card a{display:block;padding:10px 12px;border-radius:12px;color:#475569;font-size:14px}.side-card a:hover{background:var(--soft-blue);color:var(--blue-dark)}.notice{border:1px solid #fde68a;background:#fffbeb;border-radius:16px;padding:18px;color:#78350f}.form-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}.form-row{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font:inherit}.field textarea{min-height:120px}.full{grid-column:1/-1}.button-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}@media (max-width: 960px){.nav-menu,.nav-actions{display:none}.mobile-menu-toggle{display:inline-flex;margin-left:auto}.nav-shell.nav-open{height:auto;align-items:flex-start;padding-top:16px;padding-bottom:16px;flex-wrap:wrap}.nav-shell.nav-open .nav-menu,.nav-shell.nav-open .nav-actions{display:flex;width:100%;flex-direction:column;align-items:stretch}.hero-grid,.grid-2,.grid-3,.grid-4,.two-col{grid-template-columns:1fr}.hero h1{font-size:42px}.stage-row{grid-template-columns:repeat(2,1fr)}.cta-inner{flex-direction:column;align-items:flex-start}.footer-grid{grid-template-columns:1fr 1fr}.side-card{position:relative;top:auto}.form-row{grid-template-columns:1fr}.full{grid-column:auto}}@media (max-width: 560px){.container{padding:0 18px}.hero{padding:56px 0}.hero h1{font-size:34px}.page-hero h1{font-size:32px}.section-head h2{font-size:28px}.stage-row{grid-template-columns:1fr}.footer-grid{grid-template-columns:1fr}.footer-bottom{flex-direction:column}.book-cover{min-height:320px}.book-meta{grid-template-columns:1fr}}
